<!doctype html>
<!--
  Página a la que llegas al pulsar "Confirmar" en el correo de alta de Rumbo.

  CÓMO FUNCIONA: Supabase comprueba el enlace del correo y te redirige aquí
  (lo pide la app al crear la cuenta: emailRedirectTo en src/state/AppState.js).
  - Si ha ido bien, la dirección trae "#access_token=..." y enseñamos
    "Cuenta verificada".
  - Si el enlace ha caducado o ya se usó, trae "#error=...&error_description=..."
    y enseñamos qué ha pasado.
  No guardamos ni usamos el token: solo miramos si está para elegir el mensaje,
  y lo quitamos de la barra de direcciones por limpieza.
  Esta dirección tiene que estar en Supabase → Authentication → URL
  Configuration → Redirect URLs (https://rumbo.sernuu.com/**).
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta verificada · Rumbo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF7A18'/%3E%3Cstop offset='1' stop-color='%23FF2E93'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M46 18 18 30l12 4 4 12z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/space-grotesk.css">
<style>
  :root { --bg: #07070B; --surface: #111118; --border: #262633; --text: #F4F4F8; --dim: #A0A0B4; --neon: #39FF14; --orange: #FF7A18; --pink: #FF2E93; --danger: #FF4D6D; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.6; }
  .card { width: 100%; max-width: 440px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 28px; padding: 36px 26px; }
  .icon { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; font-size: 36px; }
  .ok .icon { background: rgba(57,255,20,.12); color: var(--neon); box-shadow: 0 0 30px rgba(57,255,20,.25); }
  .ko .icon { background: rgba(255,77,109,.12); color: var(--danger); }
  h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.5px; }
  p { margin: 0 0 24px; color: var(--dim); }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 52px; padding: 0 26px; border-radius: 16px; font-weight: 700; color: #fff; text-decoration: none; background: linear-gradient(135deg, var(--orange), var(--pink)); }
  .small { margin-top: 16px; font-size: 14px; }
  .small a { color: var(--dim); }
</style>
</head>
<body>
  <main class="card ok" id="card">
    <div class="icon" id="icon" aria-hidden="true">✓</div>
    <h1 id="title">¡Cuenta verificada!</h1>
    <p id="text">Ya puedes volver a Rumbo y pulsar "Entrar" con tu email y tu contraseña.</p>
    <a class="btn" href="app/">Abrir Rumbo</a>
    <p class="small"><a href="./">Ir a la web de Rumbo</a></p>
  </main>
<script>
  // Mira lo que Supabase pone después de "#" en la dirección.
  (function () {
    var params = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
    var error = params.get('error_description') || params.get('error');
    if (error) {
      document.getElementById('card').className = 'card ko';
      document.getElementById('icon').textContent = '!';
      document.getElementById('title').textContent = 'No se ha podido verificar';
      var caducado = /expired|invalid/i.test(error);
      document.getElementById('text').textContent = caducado
        ? 'El enlace ha caducado o ya se había usado. Si ya confirmaste tu cuenta, entra sin más; si no, crea la cuenta otra vez para recibir un enlace nuevo.'
        : 'Algo ha fallado (' + error + '). Prueba a entrar en Rumbo; si no te deja, crea la cuenta otra vez.';
    }
    // Quitamos el token de la barra de direcciones (no lo necesitamos).
    if (location.hash) history.replaceState(null, '', location.pathname);
  })();
</script>
</body>
</html>
